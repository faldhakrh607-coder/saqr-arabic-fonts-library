name: saqr_arabic_fonts
description: A beautiful collection of Arabic and English fonts for Flutter developers. Six Arabic families and four English families with multiple weights, ready to use with one line of code.
version: 1.0.0
homepage: https://github.com/faldhakrh607-coder/saqr-arabic-fonts-library
repository: https://github.com/faldhakrh607-coder/saqr-arabic-fonts-library
issue_tracker: https://github.com/faldhakrh607-coder/saqr-arabic-fonts-library/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Cairo
      fonts:
        - asset: lib/fonts/Cairo-Light.ttf
          weight: 300
        - asset: lib/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: lib/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: lib/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: lib/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: lib/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: lib/fonts/Cairo-Black.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: lib/fonts/Tajawal-ExtraLight.ttf
          weight: 200
